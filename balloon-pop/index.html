<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe8ef">
  <title>Birthday Balloons</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap">
  <!-- style.css / main.js carry a ?v= token that is the clock on a dev host, so
       a hand-edit shows up on the next reload instead of being served from a
       stale cache; a real host keeps a fixed token so visitors still cache.
       See index.html at the project root for the long version of why. -->
  <script>
    (function () {
      var h = location.hostname;
      var dev = location.protocol === 'file:' || !h
        || h === 'localhost' || h === '::1' || h === '[::1]'
        || /^127\./.test(h) || /^(10|192\.168|169\.254)\./.test(h)
        || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/.test(h);
      var v = window.__ASSET_V = dev ? 'dev' + Date.now() : '2026-08-11-production-2';
      document.write('<link rel="stylesheet" href="style.css?v=' + v + '">');
    })();
  </script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>

<body>

  <!-- ══════ soft drifting glow ══════ -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <!-- ══════ the play field ══════ -->
  <canvas id="field"></canvas>

  <!-- ══════ the line balloons escape past — a soft fade, not a hard rule ══════ -->
  <div class="sky-line" id="skyLine" aria-hidden="true"></div>

  <!-- ══════ HUD — pushed into the corners so the centre lane, where a
             balloon makes its last climb, is never covered ══════ -->
  <div class="hud" id="hud" aria-hidden="true">
    <div class="hud-pill hud-pill--score">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="score">0</span>
      <span class="combo-chip" id="comboChip">×2</span>
    </div>

    <div class="hud-pill hud-pill--lives">
      <span class="hud-label">Lives</span>
      <span class="life-dots" id="lifeDots">
        <i class="life-dot"></i><i class="life-dot"></i><i class="life-dot"></i>
      </span>
    </div>
  </div>

  <!-- ══════ ready-set-go ══════ -->
  <div class="countdown" id="countdown" aria-hidden="true"><span id="countdownNum">3</span></div>

  <!-- ══════ start / game-over card ══════ -->
  <div class="card-wrap" id="cardWrap">
    <section class="card" id="card" role="dialog" aria-labelledby="cardTitle">

      <!-- a little bouquet, drawn in CSS -->
      <div class="card-art" id="cardArt" aria-hidden="true">
        <span class="art-balloon b1"></span>
        <span class="art-balloon b2"></span>
        <span class="art-balloon b3"></span>
      </div>

      <p class="card-kicker" id="cardKicker">A little birthday game</p>
      <h1 class="card-title" id="cardTitle">Birthday Balloons</h1>
      <p class="card-text" id="cardText">Tap each balloon before it floats past the line</p>

      <dl class="score-row" id="scoreRow" hidden>
        <div class="score-box">
          <dt>This Round</dt>
          <dd id="finalScore">0</dd>
        </div>
        <div class="score-box score-box--best">
          <dt>Best Ever</dt>
          <dd id="bestScore">0</dd>
        </div>
      </dl>

      <p class="card-note" id="cardNote" hidden></p>

      <div class="card-actions">
        <button class="btn btn-primary" id="btnPlay" type="button">Start Playing</button>
        <a class="btn btn-ghost" id="btnHome" href="../index.html">Back to Home</a>
      </div>
    </section>
  </div>

  <script>document.write('<script src="main.js?v=' + window.__ASSET_V + '"><\/script>');</script>
</body>

</html>
